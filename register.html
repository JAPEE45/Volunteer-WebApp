<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/register.css">
</head>
<body>
  <div class="header">
    <img src="img/Philippine_Red_Cross_logo.jpg" alt="Red Cross">
    <h2>RED CROSS VOLUNTEER REGISTRATION</h2>
  </div>

  <form id="registrationForm" class="form-table">

    <h3>Personal Information</h3>
    <div class="grid">
      <div>
        <label>First Name</label>
        <input type="text" id="firstName" required>
      </div>
      <div>
        <label>Middle Name</label>
        <input type="text" id="middleName">
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" id="lastName" required>
      </div>
      <div>
        <label>Birth Place</label>
        <input type="text" id="birthPlace">
      </div>
      <div>
        <label>Sex</label>
        <select id="sex" required>
          <option value="">-- Select --</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div>
        <label>Date of Birth</label>
        <input type="date" id="dob">
      </div>
      <div>
        <label>Religion</label>
        <input type="text" id="religion">
      </div>
      <div>
        <label>Height (cm)</label>
        <input type="number" id="height">
      </div>
      <div>
        <label>Weight (kg)</label>
        <input type="number" id="weight">
      </div>
      <div>
        <label>Civil Status</label>
        <input type="text" id="civilStatus">
      </div>
      <div>
        <label>Spouse Name</label>
        <input type="text" id="spouse">
      </div>
      <div>
        <label>Number of Children</label>
        <input type="number" id="children">
      </div>
      <div>
        <label>Mobile Number</label>
        <input type="text" id="mobile">
      </div>
      <div>
        <label>Landline Number</label>
        <input type="text" id="landline">
      </div>
      <div class="wide">
        <label>Complete Address</label>
        <input type="text" id="address">
      </div>
    </div>

    <h3>Medical</h3>
    <div class="grid">
      <div>
        <label>Health conditions / Allergies</label>
        <input type="text" id="health">
      </div>
      <div>
        <label>Current Medication</label>
        <input type="text" id="medication">
      </div>
      <div>
        <label>Blood Type</label>
        <input type="text" id="bloodType">
      </div>
    </div>

    <button type="submit" class="submit-btn">SUBMIT</button>
  </form>

</body>
<script src="script/register.js"></script>
</html>
