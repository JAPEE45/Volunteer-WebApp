<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registration with SMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dc143c 0%, #a00000 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #dc143c;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #dc143c;
            outline: none;
        }
        .required {
            color: #dc143c;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #dc143c 0%, #a00000 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #0066cc;
        }
        .info h3 {
            color: #0066cc;
            margin-bottom: 10px;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Registration with SMS</h1>
        
        <div class="info">
            <h3>📝 Instructions:</h3>
            <ul>
                <li>Fill in your actual mobile number</li>
                <li>Submit the form</li>
                <li>Check your phone for SMS with login credentials</li>
                <li>SMS should arrive within a few seconds</li>
            </ul>
        </div>

        <form id="testForm">
            <div class="form-group">
                <label>First Name <span class="required">*</span></label>
                <input type="text" id="firstName" name="firstName" value="Juan" required>
            </div>

            <div class="form-group">
                <label>Middle Name</label>
                <input type="text" id="middleName" name="middleName" value="Dela">
            </div>

            <div class="form-group">
                <label>Last Name <span class="required">*</span></label>
                <input type="text" id="lastName" name="lastName" value="Cruz" required>
            </div>

            <div class="form-group">
                <label>Mobile Number <span class="required">*</span></label>
                <input type="text" id="mobile" name="mobile" placeholder="09171234567" required>
                <small>Enter YOUR actual mobile number to receive SMS</small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" value="test@example.com">
            </div>

            <div class="form-group">
                <label>Sex <span class="required">*</span></label>
                <select id="sex" name="sex" required>
                    <option value="">Select</option>
                    <option value="Male" selected>Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" name="dob" value="1990-01-01">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" name="age" value="33">
            </div>

            <button type="submit" id="submitBtn">Submit Registration & Send SMS</button>
        </form>

        <div class="result" id="result"></div>
    </div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            result.style.display = 'none';
            
            try {
                const formData = new FormData();
                
                // Add all fields
                formData.append('firstName', document.getElementById('firstName').value);
                formData.append('middleName', document.getElementById('middleName').value);
                formData.append('lastName', document.getElementById('lastName').value);
                formData.append('mobile', document.getElementById('mobile').value);
                formData.append('email', document.getElementById('email').value || '');
                formData.append('sex', document.getElementById('sex').value);
                formData.append('dob', document.getElementById('dob').value);
                formData.append('age', document.getElementById('age').value);
                
                // Add dummy data for other fields
                formData.append('birthPlace', 'Manila');
                formData.append('religion', 'Catholic');
                formData.append('bloodType', 'O+');
                
                const response = await fetch('./utility/addUser.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                result.style.display = 'block';
                
                if (data.success) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>✅ Registration Successful!</h3>
                        <p><strong>User ID:</strong> ${data.userId}</p>
                        <p><strong>Username:</strong> ${data.username}</p>
                        <p><strong>SMS Sent:</strong> ${data.sms_sent ? '✅ Yes' : '❌ No'}</p>
                        ${data.sms_sent ? 
                            '<p>📱 Check your phone for login credentials!</p>' : 
                            '<p>⚠️ SMS failed to send. Check SMS endpoint.</p>'}
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `
                        <h3>❌ Registration Failed</h3>
                        <p>${data.message || data.error || 'Unknown error'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Registration & Send SMS';
            }
        });
        
        // Auto-calculate age from DOB
        document.getElementById('dob').addEventListener('change', function() {
            const dob = new Date(this.value);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            document.getElementById('age').value = age;
        });
    </script>
</body>
</html>
